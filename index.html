<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title id="pageTitle">My Profile</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700;900&display=swap" rel="stylesheet">

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Inter', sans-serif;
    }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      background: #050505;
      color: white;
      position: relative;
    }

    /* Animated background */
    .bg {
      position: absolute;
      inset: 0;
      overflow: hidden;
      z-index: 0;
    }

    .blob {
      position: absolute;
      border-radius: 50%;
      filter: blur(100px);
      opacity: 0.5;
      animation: pulse 6s infinite ease-in-out;
    }

    .blob1 {
      width: 500px;
      height: 500px;
      background: #8b5cf6;
      top: -200px;
      left: -150px;
    }

    .blob2 {
      width: 400px;
      height: 400px;
      background: #ec4899;
      bottom: -150px;
      right: -100px;
      animation-delay: 2s;
    }

    @keyframes pulse {
      0%, 100% {
        transform: scale(1);
      }
      50% {
        transform: scale(1.15);
      }
    }

    /* Particles */
    .particle {
      position: absolute;
      width: 4px;
      height: 4px;
      background: rgba(255,255,255,0.5);
      border-radius: 50%;
      animation: float linear infinite;
    }

    @keyframes float {
      from {
        transform: translateY(0px);
      }
      to {
        transform: translateY(-100vh);
      }
    }

    /* Card */
    .card {
      position: relative;
      z-index: 5;
      width: 420px;
      padding: 40px;
      border-radius: 32px;
      background: rgba(255,255,255,0.08);
      border: 1px solid rgba(255,255,255,0.1);
      backdrop-filter: blur(20px);
      box-shadow: 0 20px 60px rgba(0,0,0,0.5);
      text-align: center;
      animation: fadeIn 1s ease;
      transition: 0.4s;
    }

    .card:hover {
      transform: translateY(-5px) scale(1.01);
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
        transform: translateY(30px) scale(0.9);
      }
      to {
        opacity: 1;
        transform: translateY(0px) scale(1);
      }
    }

    /* Avatar */
    .avatar-wrap {
      position: relative;
      width: 150px;
      height: 150px;
      margin: 0 auto 20px;
    }

    .avatar-glow {
      position: absolute;
      inset: 0;
      border-radius: 50%;
      background: linear-gradient(45deg, #ff00cc, #7c3aed);
      filter: blur(25px);
      animation: spin 8s linear infinite;
    }

    .avatar {
      position: relative;
      width: 100%;
      height: 100%;
      border-radius: 50%;
      object-fit: cover;
      border: 4px solid rgba(255,255,255,0.2);
      transition: 0.4s;
    }

    .avatar:hover {
      transform: scale(1.05);
    }

    @keyframes spin {
      from {
        transform: rotate(0deg);
      }
      to {
        transform: rotate(360deg);
      }
    }

    h1 {
      font-size: 42px;
      font-weight: 900;
      background: linear-gradient(to right, #ff4fd8, #9f67ff);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 10px;
    }

    .description {
      color: rgba(255,255,255,0.7);
      font-size: 15px;
      line-height: 1.6;
      margin-bottom: 30px;
    }

    /* Links */
    .links {
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .link {
      position: relative;
      overflow: hidden;
      padding: 16px;
      border-radius: 18px;
      background: rgba(255,255,255,0.06);
      border: 1px solid rgba(255,255,255,0.08);
      color: white;
      text-decoration: none;
      font-size: 18px;
      font-weight: 700;
      transition: 0.3s;
    }

    .link:hover {
      transform: scale(1.04);
      background: rgba(255,255,255,0.12);
    }

    .link:active {
      transform: scale(0.96);
    }

    .link::before {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(120deg, transparent, rgba(255,255,255,0.2), transparent);
      transform: translateX(-100%);
      transition: 0.8s;
    }

    .link:hover::before {
      transform: translateX(100%);
    }

    .footer {
      margin-top: 30px;
      font-size: 12px;
      color: rgba(255,255,255,0.35);
    }

    @media (max-width: 768px) {
      body {
        padding: 20px;
      }

      .card {
        width: 100%;
        max-width: 420px;
        padding: 32px 22px;
        border-radius: 28px;
      }

      .avatar-wrap {
        width: 130px;
        height: 130px;
      }

      h1 {
        font-size: 34px;
      }

      .description {
        font-size: 14px;
        line-height: 1.5;
      }

      .link {
        padding: 15px;
        font-size: 17px;
        border-radius: 16px;
      }
    }

    @media (max-width: 480px) {
      .card {
        padding: 26px 18px;
      }

      .avatar-wrap {
        width: 115px;
        height: 115px;
      }

      h1 {
        font-size: 28px;
      }

      .description {
        font-size: 13px;
      }

      .link {
        font-size: 16px;
        padding: 14px;
      }

      .footer {
        font-size: 11px;
      }
    }

    @media (min-width: 1400px) {
      .card {
        transform: scale(1.05);
      }

      .card:hover {
        transform: translateY(-8px) scale(1.07);
      }
    }
  </style>
</head>
<body>

  <script>
    // =============================
    // PROFILE DATA (DEFAULT)
    // =============================
    let profile = {
      title: document.title,
      nickname: 'YOUR NAME',
      description: 'Здесь можешь написать любую информацию о себе,<br>статус, описание, чем занимаешься и так далее.',
      avatar: 'https://i.imgur.com/2DhmtJ4.png',
      links: [
        { name: '💬 Discord', url: 'https://discord.com' },
        { name: '▶️ YouTube', url: 'https://youtube.com' },
        { name: '🎮 Steam', url: 'https://store.steampowered.com' },
        { name: '🎵 TikTok', url: 'https://tiktok.com' }
      ]
    };

    const saved = localStorage.getItem('profile_data');
    if (saved) {
      try {
        profile = JSON.parse(saved);
      } catch(e) {}
    }

    function saveProfile() {
      localStorage.setItem('profile_data', JSON.stringify(profile));
    }

    function render() {
      document.title = profile.title;
      document.querySelector('h1').innerHTML = profile.nickname;
      document.querySelector('.description').innerHTML = profile.description;
      document.querySelector('.avatar').src = profile.avatar;

      const linksContainer = document.querySelector('.links');
      linksContainer.innerHTML = '';

      profile.links.forEach(l => {
        const a = document.createElement('a');
        a.className = 'link';
        a.href = l.url;
        a.target = '_blank';
        a.innerHTML = l.name;
        linksContainer.appendChild(a);
      });
    }

    render();

    // =============================
    // ADMIN PANEL
    // =============================
    function openAdmin() {
      const pass = prompt('Enter admin password:');
      if (pass !== '1234') {
        alert('Wrong password');
        return;
      }

      let panel = document.getElementById('adminPanel');
      if (panel) panel.remove();

      panel = document.createElement('div');
      panel.id = 'adminPanel';
      panel.style.position = 'fixed';
      panel.style.top = '20px';
      panel.style.right = '20px';
      panel.style.width = '300px';
      panel.style.padding = '15px';
      panel.style.background = 'rgba(0,0,0,0.8)';
      panel.style.border = '1px solid white';
      panel.style.borderRadius = '12px';
      panel.style.zIndex = '99999';
      panel.style.color = 'white';
      panel.style.backdropFilter = 'blur(10px)';

      panel.innerHTML = `
        <h3>Admin Panel</h3>
        <input id='n1' placeholder='Nickname' style='width:100%;margin:5px 0'>
        <input id='n2' placeholder='Avatar URL' style='width:100%;margin:5px 0'>
        <textarea id='n3' placeholder='Description' style='width:100%;margin:5px 0'></textarea>
        <button id='saveBtn' style='width:100%;padding:8px'>Save</button>
      `;

      document.body.appendChild(panel);

      document.getElementById('n1').value = profile.nickname;
      document.getElementById('n2').value = profile.avatar;
      document.getElementById('n3').value = profile.description;

      document.getElementById('saveBtn').onclick = () => {
        profile.nickname = document.getElementById('n1').value;
        profile.avatar = document.getElementById('n2').value;
        profile.description = document.getElementById('n3').value;
        saveProfile();
        render();
      };
    }

    // =============================
    // ADMIN BUTTON
    // =============================
    const adminBtn = document.createElement('button');
    adminBtn.innerText = 'ADMIN';
    adminBtn.style.position = 'fixed';
    adminBtn.style.bottom = '20px';
    adminBtn.style.right = '20px';
    adminBtn.style.zIndex = '99999';
    adminBtn.style.padding = '10px 14px';
    adminBtn.style.borderRadius = '10px';
    adminBtn.style.border = '1px solid rgba(255,255,255,0.3)';
    adminBtn.style.background = 'rgba(0,0,0,0.6)';
    adminBtn.style.color = 'white';
    adminBtn.style.cursor = 'pointer';
    adminBtn.style.backdropFilter = 'blur(10px)';
    adminBtn.onclick = openAdmin;
    document.body.appendChild(adminBtn);

    // =============================
    // particles
    for (let i = 0; i < 40; i++) {
      const particle = document.createElement('div');
      particle.classList.add('particle');

      particle.style.left = Math.random() * 100 + 'vw';
      particle.style.top = Math.random() * 100 + 'vh';

      const size = Math.random() * 5 + 2;
      particle.style.width = size + 'px';
      particle.style.height = size + 'px';

      particle.style.animationDuration = (Math.random() * 10 + 5) + 's';
      particle.style.opacity = Math.random();

      document.body.appendChild(particle);
    }

    document.addEventListener('click', (e) => {
      const circle = document.createElement('div');

      circle.style.position = 'fixed';
      circle.style.left = e.clientX + 'px';
      circle.style.top = e.clientY + 'px';
      circle.style.width = '10px';
      circle.style.height = '10px';
      circle.style.borderRadius = '50%';
      circle.style.background = 'rgba(255,255,255,0.8)';
      circle.style.pointerEvents = 'none';
      circle.style.transform = 'translate(-50%, -50%)';
      circle.style.animation = 'clickAnim 0.6s ease forwards';
      circle.style.zIndex = '9999';

      document.body.appendChild(circle);

      setTimeout(() => circle.remove(), 600);
    });

    const style = document.createElement('style');
    style.innerHTML = `
      @keyframes clickAnim {
        from { opacity: 1; transform: translate(-50%, -50%) scale(1); }
        to { opacity: 0; transform: translate(-50%, -50%) scale(8); }
      }
    `;
    document.head.appendChild(style);
  </script>

  <div class="bg">
    <div class="blob blob1"></div>
    <div class="blob blob2"></div>
  </div>

  <div class="card">

    <div class="avatar-wrap">
      <div class="avatar-glow"></div>

      <img class="avatar" src="https://i.imgur.com/2DhmtJ4.png" alt="avatar">
    </div>

    <h1>YOUR NAME</h1>

    <div class="description">
      Здесь можешь написать любую информацию о себе,<br>
      статус, описание, чем занимаешься и так далее.
    </div>

    <div class="links">

      <a class="link" href="https://discord.com" target="_blank">
        💬 Discord
      </a>

      <a class="link" href="https://youtube.com" target="_blank">
        ▶️ YouTube
      </a>

      <a class="link" href="https://store.steampowered.com" target="_blank">
        🎮 Steam
      </a>

      <a class="link" href="https://tiktok.com" target="_blank">
        🎵 TikTok
      </a>

    </div>

    <div class="footer">
      made with ❤️
    </div>

  </div>

  <script>
    // =============================
    // ЗАГРУЗКА ДАННЫХ ИЗ CONFIG
    // =============================

    document.title = CONFIG.siteTitle;

    document.getElementById('nickname').innerHTML = CONFIG.nickname;
    document.getElementById('description').innerHTML = CONFIG.description;
    document.getElementById('avatar').src = CONFIG.avatar;

    const linksContainer = document.getElementById('links');

    CONFIG.links.forEach(link => {
      const a = document.createElement('a');

      a.className = 'link';
      a.href = link.url;
      a.target = '_blank';
      a.innerHTML = link.name;

      linksContainer.appendChild(a);
    });

    // particles
    for (let i = 0; i < 40; i++) {
      const particle = document.createElement('div');
      particle.classList.add('particle');

      particle.style.left = Math.random() * 100 + 'vw';
      particle.style.top = Math.random() * 100 + 'vh';

      const size = Math.random() * 5 + 2;
      particle.style.width = size + 'px';
      particle.style.height = size + 'px';

      particle.style.animationDuration = (Math.random() * 10 + 5) + 's';
      particle.style.opacity = Math.random();

      document.body.appendChild(particle);
    }

    // click effect
    document.addEventListener('click', (e) => {
      const circle = document.createElement('div');

      circle.style.position = 'fixed';
      circle.style.left = e.clientX + 'px';
      circle.style.top = e.clientY + 'px';
      circle.style.width = '10px';
      circle.style.height = '10px';
      circle.style.borderRadius = '50%';
      circle.style.background = 'rgba(255,255,255,0.8)';
      circle.style.pointerEvents = 'none';
      circle.style.transform = 'translate(-50%, -50%)';
      circle.style.animation = 'clickAnim 0.6s ease forwards';
      circle.style.zIndex = '9999';

      document.body.appendChild(circle);

      setTimeout(() => {
        circle.remove();
      }, 600);
    });

    const style = document.createElement('style');
    style.innerHTML = `
      @keyframes clickAnim {
        from {
          opacity: 1;
          transform: translate(-50%, -50%) scale(1);
        }
        to {
          opacity: 0;
          transform: translate(-50%, -50%) scale(8);
        }
      }
    `;

    document.head.appendChild(style);
  </script>

</body>
</html>
